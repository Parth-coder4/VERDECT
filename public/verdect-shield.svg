<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <defs>
    <linearGradient id="verdectNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0E2A47" />
      <stop offset="100%" stopColor="#081829" />
    </linearGradient>
    <linearGradient id="verdectCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="50%" stopColor="#0EA5E9" />
      <stop offset="100%" stopColor="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Contour -->
  <path d="M100 12 L176 44 C176 130 148 180 100 208 C52 180 24 130 24 44 Z" 
        stroke="url(#verdectCyan)" stroke-width="8" stroke-linejoin="round" fill="none" />

  <!-- Shield Left Half Background Shadow -->
  <path d="M100 16 L30 46 C30 126 56 174 100 202 Z" fill="#0C2340" opacity="0.15" />

  <!-- Balance of Justice (Left side) -->
  <!-- Center Column Pillar & Finial -->
  <path d="M100 36 L100 130" stroke="#0E2A47" stroke-width="5" stroke-linecap="round" />
  <path d="M100 36 L100 24" stroke="#0E2A47" stroke-width="6" stroke-linecap="round" />
  <circle cx="100" cy="22" r="3" fill="#0E2A47" />

  <!-- Beam of the Scale -->
  <path d="M48 68 C70 54 90 50 100 50 C110 50 130 54 152 68" stroke="#0E2A47" stroke-width="5" fill="none" stroke-linecap="round" />

  <!-- Left Scale Pan & Strings -->
  <line x1="48" y1="68" x2="32" y2="100" stroke="#0E2A47" stroke-width="3" stroke-linecap="round" />
  <line x1="48" y1="68" x2="64" y2="100" stroke="#0E2A47" stroke-width="3" stroke-linecap="round" />
  <path d="M30 100 C30 114 66 114 66 100 Z" fill="#0E2A47" />

  <!-- Cyber Digital Grid Lines on Right Half -->
  <g opacity="0.4" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="70" x2="160" y2="70" />
    <line x1="100" y1="90" x2="168" y2="90" />
    <line x1="100" y1="110" x2="162" y2="110" />
    <line x1="100" y1="130" x2="150" y2="130" />
    <line x1="120" y1="55" x2="120" y2="140" stroke-dasharray="2 4" />
    <line x1="140" y1="62" x2="140" y2="135" stroke-dasharray="2 4" />
  </g>

  <!-- Dynamic Cyan Checkmark / "V" glyph -->
  <path d="M72 106 L96 142 L172 40 C146 76 110 138 96 158 L68 116 Z" 
        fill="url(#verdectCyan)" />

  <!-- Horizontal Tech Speed Flares -->
  <line x1="125" y1="84" x2="175" y2="84" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85" />
  <line x1="135" y1="100" x2="182" y2="100" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  <line x1="120" y1="116" x2="165" y2="116" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.65" />
</svg>
