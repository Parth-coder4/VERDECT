# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - VERDECT

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: verdectregistry.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CA393F6E3E8C4886BCB478AF7A7652DE }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_35E50E9D73364EAA86684B1F9CAD70A0 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: verdectregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CA393F6E3E8C4886BCB478AF7A7652DE }}/verdect:${{ github.sha }}
          file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E19BB913B9644D7BBFCA999EC04D506 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2ABBB19FCD754E128F42D7288082B981 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_42F6FE17771A4C6E9EEC08446DF39C44 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'VERDECT'
          slot-name: 'Production'
          images: 'verdectregistry.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_CA393F6E3E8C4886BCB478AF7A7652DE }}/verdect:${{ github.sha }}'
          